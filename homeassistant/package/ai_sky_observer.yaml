##########################################################
#
# AI Sky Observer
#
# AI-powered local sky analysis for Home Assistant.
#
# Uses one or more outdoor cameras and LLM Vision to
# estimate local cloud cover, sun visibility and
# analysis confidence for local automations such as
# Adaptive Cover.
#
# Version : v0.1.0
# Author  : Waleed Gumaa
# License : MIT
# GitHub  : https://github.com/wgumaa/AI-Sky-Observer
#
##########################################################

##########################################################
#
# Helpers
#
##########################################################

##########################################################
# General
##########################################################

input_boolean:

  ai_sky_observer_enabled:
    name: AI Sky Observer Enabled
    icon: mdi:weather-partly-cloudy
    initial: true

##########################################################
# Sun Visibility
##########################################################

  ai_sky_observer_entry_sun_visible:
    name: AI Sky Observer Entry Sun Visible
    icon: mdi:white-balance-sunny

  ai_sky_observer_garden_sun_visible:
    name: AI Sky Observer Garden Sun Visible
    icon: mdi:white-balance-sunny

##########################################################
# Cloud Cover
##########################################################

input_number:

  ai_sky_observer_entry_cloud_cover:
    name: AI Sky Observer Entry Cloud Cover
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

  ai_sky_observer_garden_cloud_cover:
    name: AI Sky Observer Garden Cloud Cover
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

##########################################################
# Analysis Confidence
##########################################################

  ai_sky_observer_entry_confidence:
    name: AI Sky Observer Entry Confidence
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

  ai_sky_observer_garden_confidence:
    name: AI Sky Observer Garden Confidence
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

##########################################################
# Status
##########################################################

input_datetime:

  ai_sky_observer_last_update:
    name: AI Sky Observer Last Update
    has_date: true
    has_time: true
    
##########################################################
#
# Scripts
#
##########################################################

script:

  ai_sky_observer_analyze:
    alias: AI Sky Observer Analyzer
    mode: single

    sequence:

##########################################################
# LLM Vision Analysis
##########################################################

      - action: llmvision.image_analyzer
        response_variable: ai_result

        data:
          provider: 01KZNE1DNHTE5CS7DEV5T9YG6H
          max_tokens: 150
          response_format: json
          include_filename: true

          image_entity:
            - camera.entry_camera_high_resolution_channel
            - camera.camera_5_high_resolution_channel

          structure: |-
            {
              "type": "object",
              "properties": {
                "entry": {
                  "type": "object",
                  "properties": {
                    "ai_cloud_cover": { "type": "integer" },
                    "confidence": { "type": "integer" },
                    "sun_visible": { "type": "boolean" }
                  },
                  "required": [
                    "ai_cloud_cover",
                    "confidence",
                    "sun_visible"
                  ]
                },
                "garden": {
                  "type": "object",
                  "properties": {
                    "ai_cloud_cover": { "type": "integer" },
                    "confidence": { "type": "integer" },
                    "sun_visible": { "type": "boolean" }
                  },
                  "required": [
                    "ai_cloud_cover",
                    "confidence",
                    "sun_visible"
                  ]
                }
              },
              "required": [
                "entry",
                "garden"
              ]
            }

          message: |-
            You are an expert meteorological observer.

            You have been given two outdoor security camera images.

            Image 1 shows the ENTRY of the property.
            Image 2 shows the GARDEN.

            Analyze each image independently.

            For EACH image determine:

            1. ai_cloud_cover

            Estimate the percentage of the visible sky covered by clouds.

            Rules:
            - Return an integer from 0 to 100.
            - Estimate ONLY the visible sky.
            - Ignore buildings, roofs, walls, fences, trees, vehicles and all foreground objects.
            - Thin or high cloud contributes less than dense opaque cloud.
            - If only a small portion of the sky is visible, estimate using only the visible area.

            2. confidence

            Return an integer from 0 to 100 indicating confidence in the cloud cover estimate.

            Reduce confidence when:
            - The visible sky is limited.
            - Lighting is poor.
            - Rain, snow or dirt obscures the camera.
            - Heavy fog or haze reduces visibility.
            - Motion blur is present.

            Use high confidence only when the visible sky can be assessed clearly.

            3. sun_visible

            Return true ONLY when the actual solar disc is directly visible.

            Do NOT return true because:
            - the scene is bright,
            - shadows are visible,
            - the sky is illuminated,
            - glare or lens flare is present.

            Night-time rules:

            If the sun is below the horizon:
            - ai_cloud_cover = 0
            - confidence = 100
            - sun_visible = false

            General rules:

            - Analyze the ENTRY and GARDEN independently.
            - Never average or compare the images.
            - Never infer conditions in one image from the other.
            - Return integers only.
            - Return ONLY valid JSON matching the supplied schema.
            - Do not include explanations, markdown, comments or additional fields.
            
##########################################################
# Update Cloud Cover
##########################################################

      - action: input_number.set_value
        target:
          entity_id: input_number.ai_sky_observer_entry_cloud_cover
        data:
          value: "{{ ai_result.structured_response.entry.ai_cloud_cover }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.ai_sky_observer_garden_cloud_cover
        data:
          value: "{{ ai_result.structured_response.garden.ai_cloud_cover }}"

##########################################################
# Update Analysis Confidence
##########################################################

      - action: input_number.set_value
        target:
          entity_id: input_number.ai_sky_observer_entry_confidence
        data:
          value: "{{ ai_result.structured_response.entry.confidence }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.ai_sky_observer_garden_confidence
        data:
          value: "{{ ai_result.structured_response.garden.confidence }}"
          
##########################################################
# Update Sun Visibility
##########################################################

      - if:
          - condition: template
            value_template: "{{ ai_result.structured_response.entry.sun_visible }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ai_sky_observer_entry_sun_visible
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ai_sky_observer_entry_sun_visible

      - if:
          - condition: template
            value_template: "{{ ai_result.structured_response.garden.sun_visible }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ai_sky_observer_garden_sun_visible
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ai_sky_observer_garden_sun_visible

##########################################################
# Update Status
##########################################################

      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ai_sky_observer_last_update
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          
##########################################################
#
# Automation
#
##########################################################

automation:

  - alias: AI Sky Observer - Analyze Sky
    id: ai_sky_observer_analyze
    description: >
      Performs AI sky analysis every five minutes during daylight hours
      when AI Sky Observer is enabled.

    triggers:
      - trigger: time_pattern
        minutes: "/5"

    conditions:

      ####################################################
      # Observer Enabled
      ####################################################

      - condition: state
        entity_id: input_boolean.ai_sky_observer_enabled
        state: "on"

      ####################################################
      # Daylight Only
      ####################################################

      - condition: sun
        after: sunrise
        before: sunset

    actions:

      - action: script.ai_sky_observer_analyze

    mode: single
    
##########################################################
#
# Template Sensors
#
##########################################################

template:

##########################################################
# Cloud Cover Sensors
##########################################################

  - sensor:

      - name: AI Sky Observer Cloud Cover
        unique_id: ai_sky_observer_cloud_cover
        unit_of_measurement: "%"
        icon: mdi:weather-cloudy

        state: >
          {% set entry = states('input_number.ai_sky_observer_entry_cloud_cover') | float(0) %}
          {% set garden = states('input_number.ai_sky_observer_garden_cloud_cover') | float(0) %}
          {{ ((entry + garden) / 2) | round(0) }}

        attributes:
          entry_cloud_cover: "{{ states('input_number.ai_sky_observer_entry_cloud_cover') }}"
          garden_cloud_cover: "{{ states('input_number.ai_sky_observer_garden_cloud_cover') }}"
          entry_confidence: "{{ states('input_number.ai_sky_observer_entry_confidence') }}"
          garden_confidence: "{{ states('input_number.ai_sky_observer_garden_confidence') }}"

      - name: AI Sky Observer Entry Cloud Cover
        unique_id: ai_sky_observer_entry_cloud_cover
        unit_of_measurement: "%"
        icon: mdi:home-outline

        state: >
          {{ states('input_number.ai_sky_observer_entry_cloud_cover') }}

      - name: AI Sky Observer Garden Cloud Cover
        unique_id: ai_sky_observer_garden_cloud_cover
        unit_of_measurement: "%"
        icon: mdi:tree-outline

        state: >
          {{ states('input_number.ai_sky_observer_garden_cloud_cover') }}

##########################################################
# Analysis Confidence Sensors
##########################################################

  - sensor:

      - name: AI Sky Observer Entry Confidence
        unique_id: ai_sky_observer_entry_confidence
        unit_of_measurement: "%"
        icon: mdi:check-decagram

        state: >
          {{ states('input_number.ai_sky_observer_entry_confidence') }}

      - name: AI Sky Observer Garden Confidence
        unique_id: ai_sky_observer_garden_confidence
        unit_of_measurement: "%"
        icon: mdi:check-decagram

        state: >
          {{ states('input_number.ai_sky_observer_garden_confidence') }}

##########################################################
# Sky Condition
##########################################################

  - sensor:

      - name: AI Sky Observer Condition
        unique_id: ai_sky_observer_condition

        icon: >
          {% if is_state('sun.sun', 'below_horizon') %}
            mdi:weather-night
          {% else %}
            {% set cloud = states('sensor.ai_sky_observer_cloud_cover') | float(0) %}
            {% if cloud < 10 %}
              mdi:white-balance-sunny
            {% elif cloud < 70 %}
              mdi:weather-partly-cloudy
            {% else %}
              mdi:weather-cloudy
            {% endif %}
          {% endif %}

        state: >
          {% if is_state('sun.sun', 'below_horizon') %}
            Night
          {% else %}
            {% set cloud = states('sensor.ai_sky_observer_cloud_cover') | float(0) %}
            {% if cloud < 10 %}
              Clear
            {% elif cloud < 40 %}
              Mostly Clear
            {% elif cloud < 70 %}
              Partly Cloudy
            {% elif cloud < 90 %}
              Mostly Cloudy
            {% else %}
              Overcast
            {% endif %}
          {% endif %}

##########################################################
# Sun Visibility Sensors
##########################################################

  - binary_sensor:

      - name: AI Sky Observer Entry Sun Visible
        unique_id: ai_sky_observer_entry_sun_visible

        state: >
          {{ is_state('input_boolean.ai_sky_observer_entry_sun_visible', 'on') }}

        icon: >
          {% if is_state('input_boolean.ai_sky_observer_entry_sun_visible', 'on') %}
            mdi:white-balance-sunny
          {% else %}
            mdi:weather-cloudy
          {% endif %}

      - name: AI Sky Observer Garden Sun Visible
        unique_id: ai_sky_observer_garden_sun_visible

        state: >
          {{ is_state('input_boolean.ai_sky_observer_garden_sun_visible', 'on') }}

        icon: >
          {% if is_state('input_boolean.ai_sky_observer_garden_sun_visible', 'on') %}
            mdi:white-balance-sunny
          {% else %}
            mdi:weather-cloudy
          {% endif %}