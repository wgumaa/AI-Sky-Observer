##########################################################
#
# AI Sky Observer
#
# AI-powered local sky analysis for Home Assistant.
#
# Uses one or more outdoor cameras and LLM Vision to
# estimate local cloud cover, sun visibility and
# analysis confidence for local automations such as
# Adaptive Cover.
#
# Version : v0.1.0
# Author  : Waleed Gumaa
# License : MIT
# GitHub  : https://github.com/wgumaa/AI-Sky-Observer
#
##########################################################

##########################################################
#
# USER CONFIGURATION
#
# Replace the values below with your own Home Assistant
# configuration before using this package.
#
##########################################################

# LLM Vision Provider
#
# Replace with your own provider ID.
#
# Example:
# provider: YOUR_PROVIDER_ID
#
# Outdoor Cameras
#
# Replace the example camera entities below with your own
# outdoor cameras that have a view of the sky.
#
# AI Sky Observer analyses each camera independently.
#
# The package currently supports two cameras.
#
# Example:
#
# image_entity:
#   - camera.front_camera
#   - camera.rear_camera
#
##########################################################

##########################################################
#
# Helpers
#
##########################################################

##########################################################
# General
##########################################################

input_boolean:

  ai_sky_observer_enabled:
    name: AI Sky Observer Enabled
    icon: mdi:weather-partly-cloudy
    initial: true

##########################################################
# Sun Visibility
##########################################################

ai_sky_observer_camera_1_sun_visible:
  name: AI Sky Observer Camera 1 Sun Visible
  icon: mdi:white-balance-sunny

ai_sky_observer_camera_2_sun_visible:
  name: AI Sky Observer Camera 2 Sun Visible
  icon: mdi:white-balance-sunny

##########################################################
# Cloud Cover
##########################################################

input_number:

  ai_sky_observer_camera_1_cloud_cover:
    name: AI Sky Observer Camera 1 Cloud Cover
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

  ai_sky_observer_camera_2_cloud_cover:
    name: AI Sky Observer Camera 2 Cloud Cover
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

##########################################################
# Analysis Confidence
##########################################################

  ai_sky_observer_camera_1_confidence:
    name: AI Sky Observer Camera 1 Confidence
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

  ai_sky_observer_camera_2_confidence:
    name: AI Sky Observer Camera 2 Confidence
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    
##########################################################
# Status
##########################################################

input_datetime:

  ai_sky_observer_last_update:
    name: AI Sky Observer Last Update
    has_date: true
    has_time: true
    
##########################################################
#
# Scripts
#
##########################################################

script:

  ai_sky_observer_analyze:
    alias: AI Sky Observer Analyzer
    mode: single

    sequence:

##########################################################
# LLM Vision Analysis
##########################################################

  - action: llmvision.image_analyzer
    response_variable: ai_result

    data:

      ####################################################
      # USER CONFIGURATION
      ####################################################

      # Replace with your own LLM Vision provider ID.
      provider: YOUR_PROVIDER_ID

      # Replace with your own outdoor camera entities.
      #
      # Camera 1 and Camera 2 can be any outdoor cameras
      # with a view of the sky.
      #
      # Example:
      #
      # image_entity:
      #   - camera.front
      #   - camera.back
      #
      image_entity:
        - camera.camera_1
        - camera.camera_2

      ####################################################
      # AI CONFIGURATION
      ####################################################

      max_tokens: 150
      response_format: json
      include_filename: true

      structure: |-
        {
          "type": "object",
          "properties": {
            "camera_1": {
              "type": "object",
              "properties": {
                "ai_cloud_cover": { "type": "integer" },
                "confidence": { "type": "integer" },
                "sun_visible": { "type": "boolean" }
              },
              "required": [
                "ai_cloud_cover",
                "confidence",
                "sun_visible"
              ]
            },
            "camera_2": {
              "type": "object",
              "properties": {
                "ai_cloud_cover": { "type": "integer" },
                "confidence": { "type": "integer" },
                "sun_visible": { "type": "boolean" }
              },
              "required": [
                "ai_cloud_cover",
                "confidence",
                "sun_visible"
              ]
            }
          },
          "required": [
            "camera_1",
            "camera_2"
          ]
        }

      message: |-
        You are an expert meteorological observer.

        You have been given two outdoor security camera images.

        Analyze each image independently.

        The first image corresponds to Camera 1.
        The second image corresponds to Camera 2.

        Do not assume the cameras observe any particular location.
        Treat each image as an independent observation of the local sky.

        For EACH image determine:

        1. ai_cloud_cover

        Estimate the percentage of the visible sky covered by clouds.

        Rules:
        - Return an integer from 0 to 100.
        - Estimate ONLY the visible sky.
        - Ignore buildings, roofs, walls, fences, trees, vehicles and all foreground objects.
        - Thin or high cloud contributes less than dense opaque cloud.
        - If only a small portion of the sky is visible, estimate using only the visible area.

        2. confidence

        Return an integer from 0 to 100 indicating confidence in the cloud cover estimate.

        Reduce confidence when:
        - The visible sky is limited.
        - Lighting is poor.
        - Rain, snow or dirt obscures the camera.
        - Heavy fog or haze reduces visibility.
        - Motion blur is present.

        Use high confidence only when the visible sky can be assessed clearly.

        3. sun_visible

        Return true ONLY when the actual solar disc is directly visible.

        Do NOT return true because:
        - the scene is bright,
        - shadows are visible,
        - the sky is illuminated,
        - glare or lens flare is present.

        Night-time rules:

        If the sun is below the horizon:
        - ai_cloud_cover = 0
        - confidence = 100
        - sun_visible = false

        General rules:

        - Analyze Camera 1 and Camera 2 independently.
        - Never average or compare the images.
        - Never infer conditions in one image from the other.
        - Return integers only.
        - Return ONLY valid JSON matching the supplied schema.
        - Do not include explanations, markdown, comments or additional fields.
            
##########################################################
# Update Cloud Cover
##########################################################

  - action: input_number.set_value
    target:
      entity_id: input_number.ai_sky_observer_camera_1_cloud_cover
    data:
      value: "{{ ai_result.structured_response.camera_1.ai_cloud_cover }}"

  - action: input_number.set_value
    target:
      entity_id: input_number.ai_sky_observer_camera_2_cloud_cover
    data:
      value: "{{ ai_result.structured_response.camera_2.ai_cloud_cover }}"

##########################################################
# Update Analysis Confidence
##########################################################

  - action: input_number.set_value
    target:
      entity_id: input_number.ai_sky_observer_camera_1_confidence
    data:
      value: "{{ ai_result.structured_response.camera_1.confidence }}"

  - action: input_number.set_value
    target:
      entity_id: input_number.ai_sky_observer_camera_2_confidence
    data:
      value: "{{ ai_result.structured_response.camera_2.confidence }}"

##########################################################
# Update Sun Visibility
##########################################################

  - if:
      - condition: template
        value_template: "{{ ai_result.structured_response.camera_1.sun_visible }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ai_sky_observer_camera_1_sun_visible
    else:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ai_sky_observer_camera_1_sun_visible

  - if:
      - condition: template
        value_template: "{{ ai_result.structured_response.camera_2.sun_visible }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ai_sky_observer_camera_2_sun_visible
    else:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ai_sky_observer_camera_2_sun_visible
          
##########################################################
# Update Status
##########################################################

      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ai_sky_observer_last_update
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          
##########################################################
#
# Automation
#
##########################################################

automation:

  - alias: AI Sky Observer - Analyze Sky
    id: ai_sky_observer_analyze
    description: >
      Performs AI sky analysis every five minutes during daylight hours
      when AI Sky Observer is enabled.

    triggers:
      - trigger: time_pattern
        minutes: "/5"

    conditions:

      ####################################################
      # Observer Enabled
      ####################################################

      - condition: state
        entity_id: input_boolean.ai_sky_observer_enabled
        state: "on"

      ####################################################
      # Daylight Only
      ####################################################

      - condition: sun
        after: sunrise
        before: sunset

    actions:

      - action: script.ai_sky_observer_analyze

    mode: single
    
##########################################################
#
# Template Sensors
#
##########################################################

template:

##########################################################
# Cloud Cover Sensors
##########################################################

- sensor:
    - name: AI Sky Observer Cloud Cover
      unique_id: ai_sky_observer_cloud_cover
      unit_of_measurement: "%"
      icon: mdi:weather-cloudy

      state: >
        {% set camera_1 = states('input_number.ai_sky_observer_camera_1_cloud_cover') | float(0) %}
        {% set camera_2 = states('input_number.ai_sky_observer_camera_2_cloud_cover') | float(0) %}
        {{ ((camera_1 + camera_2) / 2) | round(0) }}

      attributes:
        camera_1_cloud_cover: "{{ states('input_number.ai_sky_observer_camera_1_cloud_cover') }}"
        camera_2_cloud_cover: "{{ states('input_number.ai_sky_observer_camera_2_cloud_cover') }}"
        camera_1_confidence: "{{ states('input_number.ai_sky_observer_camera_1_confidence') }}"
        camera_2_confidence: "{{ states('input_number.ai_sky_observer_camera_2_confidence') }}"

    - name: AI Sky Observer Camera 1 Cloud Cover
      unique_id: ai_sky_observer_camera_1_cloud_cover
      unit_of_measurement: "%"
      icon: mdi:camera-outline

      state: >
        {{ states('input_number.ai_sky_observer_camera_1_cloud_cover') }}

    - name: AI Sky Observer Camera 2 Cloud Cover
      unique_id: ai_sky_observer_camera_2_cloud_cover
      unit_of_measurement: "%"
      icon: mdi:camera-outline

      state: >
        {{ states('input_number.ai_sky_observer_camera_2_cloud_cover') }}
        
##########################################################
# Analysis Confidence Sensors
##########################################################

- sensor:
    - name: AI Sky Observer Camera 1 Confidence
      unique_id: ai_sky_observer_camera_1_confidence
      unit_of_measurement: "%"
      icon: mdi:check-decagram

      state: >
        {{ states('input_number.ai_sky_observer_camera_1_confidence') }}

    - name: AI Sky Observer Camera 2 Confidence
      unique_id: ai_sky_observer_camera_2_confidence
      unit_of_measurement: "%"
      icon: mdi:check-decagram

      state: >
        {{ states('input_number.ai_sky_observer_camera_2_confidence') }}

##########################################################
# Sky Condition
##########################################################

  - sensor:

      - name: AI Sky Observer Condition
        unique_id: ai_sky_observer_condition

        icon: >
          {% if is_state('sun.sun', 'below_horizon') %}
            mdi:weather-night
          {% else %}
            {% set cloud = states('sensor.ai_sky_observer_cloud_cover') | float(0) %}
            {% if cloud < 10 %}
              mdi:white-balance-sunny
            {% elif cloud < 70 %}
              mdi:weather-partly-cloudy
            {% else %}
              mdi:weather-cloudy
            {% endif %}
          {% endif %}

        state: >
          {% if is_state('sun.sun', 'below_horizon') %}
            Night
          {% else %}
            {% set cloud = states('sensor.ai_sky_observer_cloud_cover') | float(0) %}
            {% if cloud < 10 %}
              Clear
            {% elif cloud < 40 %}
              Mostly Clear
            {% elif cloud < 70 %}
              Partly Cloudy
            {% elif cloud < 90 %}
              Mostly Cloudy
            {% else %}
              Overcast
            {% endif %}
          {% endif %}

##########################################################
# Sun Visibility Sensors
##########################################################

- binary_sensor:
    - name: AI Sky Observer Camera 1 Sun Visible
      unique_id: ai_sky_observer_camera_1_sun_visible

      state: >
        {{ is_state('input_boolean.ai_sky_observer_camera_1_sun_visible', 'on') }}

      icon: >
        {% if is_state('input_boolean.ai_sky_observer_camera_1_sun_visible', 'on') %}
          mdi:white-balance-sunny
        {% else %}
          mdi:weather-cloudy
        {% endif %}

    - name: AI Sky Observer Camera 2 Sun Visible
      unique_id: ai_sky_observer_camera_2_sun_visible

      state: >
        {{ is_state('input_boolean.ai_sky_observer_camera_2_sun_visible', 'on') }}

      icon: >
        {% if is_state('input_boolean.ai_sky_observer_camera_2_sun_visible', 'on') %}
          mdi:white-balance-sunny
        {% else %}
          mdi:weather-cloudy
        {% endif %}