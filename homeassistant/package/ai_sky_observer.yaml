##########################################################
#
# AI Sky Observer
# Version: 0.1.0
#
##########################################################

##########################################################
# Helpers
##########################################################

input_boolean:

  ai_sky_observer_enabled:
    name: AI Sky Observer Enabled
    icon: mdi:weather-partly-cloudy
    initial: true

  ai_sky_observer_entry_sun_visible:
    name: AI Sky Observer Entry Sun Visible
    icon: mdi:white-balance-sunny

  ai_sky_observer_garden_sun_visible:
    name: AI Sky Observer Garden Sun Visible
    icon: mdi:white-balance-sunny

##########################################################

input_number:

  ai_sky_observer_entry_cloud_cover:
    name: AI Sky Observer Entry Cloud Cover
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

  ai_sky_observer_garden_cloud_cover:
    name: AI Sky Observer Garden Cloud Cover
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

  ai_sky_observer_entry_confidence:
    name: AI Sky Observer Entry Confidence
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

  ai_sky_observer_garden_confidence:
    name: AI Sky Observer Garden Confidence
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

##########################################################

input_datetime:

  ai_sky_observer_last_update:
    name: AI Sky Observer Last Update
    has_date: true
    has_time: true

##########################################################
# Scripts
##########################################################

script:

  ai_sky_observer_test:
    alias: AI Sky Observer Test
    mode: single

    sequence:

      - action: llmvision.image_analyzer
        response_variable: ai_result
        data:
          provider: 01KZNE1DNHTE5CS7DEV5T9YG6H
          max_tokens: 150
          response_format: json
          image_entity:
            - camera.entry_camera_high_resolution_channel
            - camera.camera_5_high_resolution_channel
          include_filename: true


          structure: |-
            {
              "type": "object",
              "properties": {
                "front": {
                  "type": "object",
                  "properties": {
                    "ai_cloud_cover": { "type": "integer" },
                    "confidence": { "type": "integer" },
                    "sun_visible": { "type": "boolean" }
                  },
                  "required": [
                    "ai_cloud_cover",
                    "confidence",
                    "sun_visible"
                  ]
                },
                "back": {
                  "type": "object",
                  "properties": {
                    "ai_cloud_cover": { "type": "integer" },
                    "confidence": { "type": "integer" },
                    "sun_visible": { "type": "boolean" }
                  },
                  "required": [
                    "ai_cloud_cover",
                    "confidence",
                    "sun_visible"
                  ]
                }
              },
              "required": [
                "front",
                "back"
              ]
            }

          message: |-
            You are an expert meteorological observer.

            You have been given TWO outdoor security camera images.

            Image 1 is the FRONT of the property.
            Image 2 is the REAR of the property.

            Analyze EACH image independently.

            For EACH image determine:

            - Cloud cover percentage (0-100)
            - Confidence (0-100)
            - Whether the sun is directly visible (true/false)

            Return ONLY valid JSON.
            
      - action: input_number.set_value
        target:
          entity_id: input_number.ai_sky_observer_entry_cloud_cover
        data:
          value: "{{ ai_result.structured_response.front.ai_cloud_cover }}"
          
      - action: input_number.set_value
        target:
          entity_id: input_number.ai_sky_observer_garden_cloud_cover
        data:
          value: "{{ ai_result.structured_response.back.ai_cloud_cover }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.ai_sky_observer_entry_confidence
        data:
          value: "{{ ai_result.structured_response.front.confidence }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.ai_sky_observer_garden_confidence
        data:
          value: "{{ ai_result.structured_response.back.confidence }}"
          
      - if:
          - condition: template
            value_template: "{{ ai_result.structured_response.front.sun_visible }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ai_sky_observer_entry_sun_visible
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ai_sky_observer_entry_sun_visible

      - if:
          - condition: template
            value_template: "{{ ai_result.structured_response.back.sun_visible }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ai_sky_observer_garden_sun_visible
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ai_sky_observer_garden_sun_visible

      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ai_sky_observer_last_update
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
 
      - action: persistent_notification.create
        data:
          title: AI Result
          message: "{{ ai_result | tojson }}"


